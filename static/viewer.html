<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Babylon Viewer Demo</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script type="module" src="/assets/js/viewerLoader.js"></script>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        padding: 0;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script>
      // URLSearchParams keeps other params (such as the loader's ?viewer=lite|full
      // override) out of the model URL and percent-decodes the value. Build the
      // element with DOM APIs so a crafted ?url= cannot inject markup.
      const url =
        new URLSearchParams(location.search).get("url") ||
        "https://raw.githubusercontent.com/BabylonJS/Assets/master/meshes/ufo.glb";

      const viewer = document.createElement("babylon-viewer");
      viewer.setAttribute("source", url);
      viewer.setAttribute("environment", "auto");
      viewer.setAttribute("camera-auto-orbit", "");
      document.body.replaceChildren(viewer);
    </script>
  </body>
</html>
